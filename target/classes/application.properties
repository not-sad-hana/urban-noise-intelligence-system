# =============================================================================
# Server Configuration
# =============================================================================
server.port=8080
server.servlet.context-path=/

# =============================================================================
# PostgreSQL Database Connection
# =============================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:urban_pollution_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# =============================================================================
# JPA / Hibernate Configuration
# =============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SQL initialization for seed data
spring.sql.init.mode=never

# =============================================================================
# Ramapuram, Chennai Geo-Fencing & Area Lock Bounding Box
# =============================================================================
ramapuram.bounds.lat.min=13.010000
ramapuram.bounds.lat.max=13.050000
ramapuram.bounds.lng.min=80.165000
ramapuram.bounds.lng.max=80.200000

# =============================================================================
